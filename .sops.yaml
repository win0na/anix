# The AGE_RECIPIENT_* placeholders are replaced at bootstrap.
keys:
  anix: &anix AGE_RECIPIENT_ANIX
  amac: &amac AGE_RECIPIENT_AMAC
  winona: &winona AGE_RECIPIENT_WINONA
  recovery: &recovery AGE_RECIPIENT_RECOVERY

creation_rules:
  - path_regex: ^secrets/[^/]+\.yaml$
    age:
      - *anix
      - *amac
      - *winona
      - *recovery
